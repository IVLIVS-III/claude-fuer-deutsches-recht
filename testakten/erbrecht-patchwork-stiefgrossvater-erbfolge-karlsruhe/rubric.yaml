name: erbrecht-patchwork-stiefgrossvater-erbfolge-karlsruhe
description: Patchwork-Erbfolge mit mehrfachen Ehen, Scheidungen, früherer Stieftochter als Ehefrau, zwei Erbfällen, alten Testamenten und Statusmatrix.
checks:
  - Moralische Bewertung strikt von Verwandtschaft, Ehe und Testament trennen.
  - Testamente nach Errichtungszeitpunkt und Scheidungsbezug prüfen.
  - Fiona bei Armin als Ehefrau, nicht als Kind behandeln.
  - Fiona bei Clemens als leibliche Tochter behandeln.
  - Erbfälle Armin und Clemens chronologisch getrennt lösen.

