name: strafrecht-haeusliche-gewalt-koerperverletzung-dresden
description: Ermittlungsakte zu häuslicher Gewalt in Dresden mit ärztlichem Befund, Nachbarzeugen, Kontaktverbot, Aussagekonstanz und Verteidigungs- wie Opferschutzperspektive.
checks:
  - Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - Sicherstellungskette, Belehrung und digitale Originaldaten gesondert prüfen.
  - Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - Nebenklagefähige Aktenauswertung, Schutzantragsentwurf und Beweisanregung zur Sicherung der Originalfotos sowie der Funkstreifenwagen-Bodycam-Metadaten.
