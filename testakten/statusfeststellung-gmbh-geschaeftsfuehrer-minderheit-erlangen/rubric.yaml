name: statusfeststellung-gmbh-geschaeftsfuehrer-minderheit-erlangen
description: Statusfeststellung eines Minderheits-Gesellschafter-Geschaeftsfuehrers mit 32 Prozent, gestaffelter Sperrminoritaet, Buergschaft, DRV-Verfahren von Anhoerung bis Vergleich.
checks:
  - Kapitalmehrheit von der gesellschaftsvertraglichen Rechtsmacht sauber unterscheiden.
  - Reichweite der Sperrminoritaet aus Paragraf 6.5 des Gesellschaftsvertrags korrekt als ressortbeschraenkt einordnen, nicht als umfassendes Vetorecht.
  - Buergschaft und Fachwissen als Unternehmerrisiko werten, aber nicht mit Rechtsmacht gleichsetzen.
  - Zeitliche Zaesur der Satzungsaenderung vom 19.09.2025 bei der Bewertung beruecksichtigen.
  - Rechtsprechung des Bundessozialgerichts zur Abgrenzung von Rechtsmacht und tatsaechlicher Unentbehrlichkeit korrekt anwenden.
  - Verjaehrung nach Paragraf 25 SGB IV und Saeumniszuschlaege getrennt pruefen.
  - Keine vorgefertigte Statusbewertung uebernehmen, sondern aus den Rohbelegen selbst ableiten.
