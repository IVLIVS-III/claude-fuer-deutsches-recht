name: insolvenzanfechtung-kiezflitzer-gesellschafterdarlehen-berlin
description: Insolvenzanfechtung aus Verwaltersicht gegen einen Gesellschafter-Berater eines Berliner Start-ups
  mit Darlehensrückzahlung in der Jahresfrist, bezahlter echter Beratungsleistung, vertragslosem Vorschuss, Eröffnungsunterlagen
  und Gutachten zu Zahlungsunfähigkeit und Überschuldung.
checks:
  - id: zahlungsdaten-vorhanden
    check_type: file_exists
    description: Die Kontoauszugsdaten zu den angegriffenen Zahlungen sind vorhanden.
    path: 07_kontoauszuege_auszuege_2024_2025.csv
  - id: liquiditaetsstatus-vorhanden
    check_type: file_exists
    description: Der Liquiditätsstatus mit den maßgeblichen Stichtagen ist vorhanden.
    path: 15_liquiditaetsstatus_stichtage.csv
  - id: prozessdokumente-vorhanden
    check_type: file_exists
    description: Die Klageschrift für die gerichtliche Durchsetzung ist vorhanden.
    path: 19_klageschrift_lg_berlin_2026-09-01.docx
  - id: zahlungen-trennen
    check_type: human_review
    description: Die drei Zahlungen werden getrennt und jeweils der einschlägigen Anfechtungsnorm zugeordnet.
    note: Paragraf 135 Absatz 1 Nummer 2, Paragraf 130, Paragraf 131 Absatz 1 Nummer 1 und Paragraf 133 InsO differenziert
      prüfen.
  - id: fristbezugspunkt
    check_type: human_review
    description: Die Anfechtungsfristen werden vom Eröffnungsantrag am 14.11.2025 und nicht von der Eröffnung am
      01.03.2026 zurückgerechnet.
    note: Für jede Zahlung einen eigenen Fristenlauf ausweisen.
  - id: gesellschafterdarlehen
    check_type: human_review
    description: Kenntnisunabhängigkeit und fehlendes Kleinbeteiligtenprivileg bei 20 Prozent Beteiligung werden
      für Paragraf 135 InsO erkannt.
    note: Gesellschafterstellung und Rückgewährtatbestand aus den Urkunden belegen.
  - id: kenntnis-und-beweise
    check_type: human_review
    description: Die Kenntnis nach Paragraf 130 und Paragraf 133 InsO wird anhand aller ambivalenten Beweismittel
      gewürdigt.
    note: Wochenreports, LOI, Gründer-Chat und Protokoll weder einseitig noch isoliert bewerten.
  - id: naeheverhaeltnis
    check_type: human_review
    description: Das Näheverhältnis nach Paragraf 138 Absatz 2 InsO und seine Beweisfolgen werden geprüft.
    note: Tatsächliche Rollen, Beteiligung und Informationszugang getrennt feststellen.
  - id: bargeschaeft
    check_type: human_review
    description: Der Bargeschäftseinwand für verdientes Honorar wird vom vertragslosen Vorschuss getrennt.
    note: Leistung, Gegenleistung, zeitliche Nähe und Gläubigerbenachteiligung je Zahlung prüfen.
  - id: stichtage-und-zinsen
    check_type: human_review
    description: Überschuldung am 30.06.2025 und Zahlungsunfähigkeit am 01.09.2025 werden als Beweismittel eingeordnet
      und Zinsen nach Paragraf 143 Absatz 1 InsO geprüft.
    note: Gutachtenaussage, Primärdaten und prozessuale Darlegung getrennt ausweisen.
