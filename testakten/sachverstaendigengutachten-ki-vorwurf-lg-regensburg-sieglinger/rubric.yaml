name: "Sachverstaendigengutachten Regensburg Sieglinger"
plugin: "vertragsrecht"

checks:
  - id: r01-readme-vorhanden
    check_type: file_exists
    description: "README.md vorhanden"
    path: "README.md"

  - id: r02-gesamt-pdf-vorhanden
    check_type: file_exists
    description: "Gesamt-PDF gebaut"
    path: "gesamt-pdf/sachverstaendigengutachten-ki-vorwurf-lg-regensburg-sieglinger_gesamt.pdf"

  - id: r03-vollstaendige-parteischriftsaetze
    check_type: file_count
    description: "Klage und Klageerwiderung liegen als vollstaendige DOCX vor"
    glob: "0[12]_*.docx"
    min: 2

  - id: r04-technische-rohdaten
    check_type: file_count
    description: "Monitorwerte und Ereignisspeicher liegen als getrennte Tabellen vor"
    glob: "0[57]_*.csv"
    min: 2

  - id: r05-keine-platzhalter
    check_type: human_review
    description: "Kein exportiertes Aktenstueck enthaelt Auslassungszeichen, redaktionelle Platzhalter oder interne Loesungshinweise"

  - id: r06-konsistente-ertragswerte
    check_type: human_review
    description: "Die Monatswerte fuer 2024 summieren sich auf den im Gutachten genannten korrigierten Ertrag von 73140 kWh"

  - id: r07-getrennte-dokumente
    check_type: human_review
    description: "Parteischriftsaetze, Gutachten, gerichtliche Verfuegung, Stellungnahme und Sitzungsprotokoll sind jeweils eigene Dokumente"
