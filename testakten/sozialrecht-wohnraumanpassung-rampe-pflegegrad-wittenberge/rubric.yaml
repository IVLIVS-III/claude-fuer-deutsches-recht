name: sozialrecht-wohnraumanpassung-rampe-pflegegrad-wittenberge
description: Pflegekassenstreit um feste Rampe bei Pflegegrad 3 mit Teilbewilligung, mobiler Alternative, Wohnumfeld, Sturzrisiko und möglicher Sozialhilfe.
checks:
  - Pflegegrad und Mobilitätsmodul als Tatsachengrundlage nutzen.
  - Mobile Rampe funktional gegen feste Rampe vergleichen.
  - Zuschussgrenze, Eigenanteil und weitere Kostenträger trennen.
  - Wohnumfeld konkret aus Maßen, Fotos und Winterrisiko würdigen.
  - Widerspruch nicht als Komfortwunsch, sondern als Selbstständigkeits- und Pflegethema begründen.

