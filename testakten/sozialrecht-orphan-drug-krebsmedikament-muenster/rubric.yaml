name: sozialrecht-orphan-drug-krebsmedikament-muenster
description: Eilfall zur Kostenübernahme eines extrem teuren Orphan-Drug-Krebsmedikaments mit Tumorboard, MD-Ablehnung, Kassenbescheid und Eilantrag.
checks:
  - Lebensbedrohliche Erkrankung und fehlende Standardalternative herausarbeiten.
  - Orphan-Drug-Zulassung nicht mit sicherer Leistungspflicht verwechseln.
  - Wirtschaftlichkeit konkret gegen Nutzen- und Folgenabwägung stellen.
  - MD-Aktenlage auf fehlende individuelle Befassung prüfen.
  - Eilantrag mit Anordnungsgrund und Beweisangeboten formulieren.

