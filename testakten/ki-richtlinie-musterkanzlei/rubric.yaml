name: "Organisationsakte Koenig Brehm Partner"
plugin: "ki-richtlinie-kanzleien"

checks:
  - id: r01-readme-vorhanden
    check_type: file_exists
    description: "README.md vorhanden"
    path: "README.md"
  - id: r02-gesamt-pdf-vorhanden
    check_type: file_exists
    description: "Gesamt-PDF gebaut"
    path: "gesamt-pdf/ki-richtlinie-musterkanzlei_gesamt.pdf"
  - id: r03-arbeitsunterlagen
    check_type: working_file_count
    description: "Mindestens zehn exportierbare Arbeitsunterlagen vorhanden"
    min: 10
  - id: r04-zugriffsstoerung
    check_type: file_exists
    description: "E-Mail zur Zugriffsstoerung vorhanden"
    path: "02_sekretariat_zugriffsstoerung_2026-05-21.eml"
  - id: r05-abrechnungsabweichung
    check_type: file_contains
    description: "Ungeklaerte Kostenstelle bleibt in den Rohdaten erhalten"
    path: "05_lizenzabrechnung_2026-q2.csv"
    contains: "Sammelkonto Bibliothek"
