name: unfallversicherung-arbeitsunfall-lagerleiter-sturz-trier
description: Arbeitsunfall eines Lagerleiters durch Sturz an einer klemmenden Ueberladebruecke, mit Kameraausfall, Vorschaden an der Schulter und vollstaendigem Instanzenzug von Anhoerung bis Sachverstaendigengutachten.
checks:
  - Vollbeweis des Unfallereignisses von der bloss moeglichen Kausalitaet unterscheiden und die Indizienkette aus Zeugenangaben, Wartungsbuch und medizinischem Erstbefund selbst zusammenfuehren.
  - Kameraausfall als neutralen Umstand werten, nicht automatisch zulasten oder zugunsten einer Partei.
  - Abgrenzung zwischen Gelegenheitsursache und wesentlicher Teilursache bei vorbestehendem degenerativem Schaden korrekt anwenden.
  - Bedeutung des innerbetrieblichen Zustaendigkeitsverstosses fuer den Zusammenhang mit der versicherten Taetigkeit selbststaendig einordnen, nicht vorschnell verneinen.
  - MdE-Einschaetzung und Verletztenrentenanspruch nach Paragraf 56 SGB VII rechnerisch nachvollziehen.
  - Verletztengeldberechnung nach Paragraf 47 SGB VII von der Entgeltfortzahlung sauber abgrenzen.
  - Keine vorgefertigte Kausalitaetsbewertung uebernehmen, sondern aus den Rohbelegen selbst ableiten.
