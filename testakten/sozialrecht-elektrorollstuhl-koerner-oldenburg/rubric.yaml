name: sozialrecht-elektrorollstuhl-koerner-oldenburg
description: Hilfsmittelstreit um Elektrorollstuhl nach Paragraf 33 SGB V mit MD-Ablehnung, privatem Reha-Gutachten, vollstaendiger Klage, Kassenverteidigung, Beweisbeschluss und gerichtlichem Sachverstaendigengutachten.
checks:
  - Klagefrist aus dem Widerspruchsbescheid korrekt erkennen.
  - Anspruch aus Paragraf 33 SGB V sauber vom bloßen Komfortinteresse abgrenzen.
  - Gehstock, Rollator, manuellen Rollstuhl und Elektrorollstuhl funktional vergleichen.
  - Wirtschaftlichkeit nicht mit billigster Versorgung verwechseln.
  - MD-Aktenlage gegen persönliche Untersuchung, Reha-Gutachten und gerichtliches Sachverständigengutachten beweiswürdigend einordnen.
  - Klageschrift, Klageerwiderung und Beweisbeschluss inhaltlich sauber auseinanderhalten.
  - BSG-Rechtsprechung zum Basisausgleich (unter anderem B 3 KR 3/19 R) korrekt auf den Einzelfall anwenden, ohne das Ergebnis vorwegzunehmen.
  - Eigene Bewertung der Beweislage entwickeln, statt eine vorgegebene Antwortmatrix zu übernehmen.
